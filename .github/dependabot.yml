version: 2
updates:
  # GitHub Actions: keeps SHA pins and their version comments current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Python: the test toolchain and the pinned runtime requirement
  # (requirements_test.txt). manifest.json's requirement is bumped by hand.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Patch and minor bumps ride together for review convenience; CI still
      # decides whether each one is safe.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
