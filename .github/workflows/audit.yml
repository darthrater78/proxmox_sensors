name: Weekly dependency audit

# Reports advisories published after a dependency was merged. Report-only:
# it writes the job summary and never fails the run; Dependabot alerts and
# dependency review are the blocking guards.

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Audit pinned requirements
        run: |
          # Report-only step: -e omitted on purpose so findings never fail the run.
          set -uo pipefail
          pip install -q pip-audit==2.10.1
          {
            echo "## pip-audit: requirements_test.txt"
            echo '```'
            pip-audit -r requirements_test.txt --progress-spinner off 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
