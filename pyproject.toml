# Tooling configuration only. The integration itself is packaged by HACS
# straight from custom_components/, not from this file.

[tool.ruff]
target-version = "py314"
extend-exclude = ["docs"]

[tool.ruff.lint]
# Syntax errors plus every pyflakes rule (undefined names, unused imports and
# variables, redefinitions). Widen this as the codebase is cleaned up.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
